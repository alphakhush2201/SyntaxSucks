<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500">
  <!-- Background square with rounded corners -->
  <rect x="50" y="50" width="400" height="400" rx="50" ry="50" fill="#2d1b3a" stroke="#2d1b3a" stroke-width="15"/>
  
  <!-- Inner square with rounded corners (cyan background) -->
  <rect x="80" y="80" width="340" height="340" rx="30" ry="30" fill="#22d3ee"/>
  
  <!-- Letter S with angry face -->
  <path d="M250 130 C180 130, 160 170, 160 200 C160 230, 180 250, 250 250 C320 250, 340 270, 340 300 C340 330, 320 370, 250 370 C180 370, 160 330, 160 300" stroke="#2d1b3a" stroke-width="25" fill="none"/>
  
  <!-- Eyes -->
  <circle cx="210" cy="200" r="15" fill="#2d1b3a"/>
  <circle cx="290" cy="200" r="15" fill="#2d1b3a"/>
  
  <!-- Eyebrows -->
  <line x1="190" y1="180" x2="230" y2="170" stroke="#2d1b3a" stroke-width="10" stroke-linecap="round"/>
  <line x1="270" y1="170" x2="310" y2="180" stroke="#2d1b3a" stroke-width="10" stroke-linecap="round"/>
  
  <!-- Mouth (frown) -->
  <path d="M220 240 C240 230, 260 230, 280 240" stroke="#2d1b3a" stroke-width="10" fill="none"/>
  
  <!-- X symbol in top right -->
  <line x1="350" y1="100" x2="380" y2="130" stroke="#ff6b8b" stroke-width="15" stroke-linecap="round"/>
  <line x1="380" y1="100" x2="350" y2="130" stroke="#ff6b8b" stroke-width="15" stroke-linecap="round"/>
  
  <!-- Squiggly line on left -->
  <path d="M120 200 Q130 220, 120 240 Q110 260, 120 280" stroke="#ffcc00" stroke-width="10" fill="none" stroke-linecap="round"/>
  
  <!-- SYNTAX text -->
  <text x="250" y="420" font-family="Arial, sans-serif" font-size="40" font-weight="bold" text-anchor="middle" fill="#ffffff">SYNTAX</text>
  
  <!-- SUCKS text -->
  <text x="250" y="470" font-family="Arial, sans-serif" font-size="60" font-weight="bold" text-anchor="middle" fill="#ffffff">SUCKS</text>
</svg>