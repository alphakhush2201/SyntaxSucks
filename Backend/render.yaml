services:
  - type: web
    name: syntaxsucks-api
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: GEMINI_API_KEY
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      - key: DEBUG
        value: false
      - key: CORS_ORIGINS
        value: https://syntaxsucks.vercel.app
    autoDeploy: true 